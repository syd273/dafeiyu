<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>安诗鱼 · 上帝视角</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #0b0e16; overflow: hidden;
    font-family: "HarmonyOS Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; color: #e8eeff; }
  #scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #top { position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 14px;
    padding: 10px 18px; background: linear-gradient(180deg, rgba(8, 10, 18, 0.92), rgba(8, 10, 18, 0));
    z-index: 10; }
  #top .title { font-size: 15px; font-weight: 600; color: #cfe0ff; letter-spacing: 1px; }
  #top .meta { font-size: 11px; color: #6f7fae; }
  #top .spacer { flex: 1; }
  #top .clock { font-size: 13px; color: #9fb0d8; font-variant-numeric: tabular-nums; }
  #statusbar { position: absolute; left: 16px; bottom: 14px; z-index: 20; font-size: 12px;
    color: #9fb0d8; background: rgba(17, 21, 31, 0.85); padding: 8px 12px; border-radius: 10px;
    border: 1px solid rgba(80, 110, 180, 0.2); max-width: 55%; }
  #statusbar b { color: #ffd48a; font-weight: 600; }
  #feed { position: absolute; right: 16px; top: 56px; z-index: 20; width: 250px; max-height: 55%;
    overflow: hidden; font-size: 10px; color: #8fa2d8; background: rgba(17, 21, 31, 0.72);
    padding: 10px 12px; border-radius: 12px; border: 1px solid rgba(80, 110, 180, 0.18); }
  #feed .row { padding: 4px 0; border-bottom: 1px dashed rgba(80, 110, 180, 0.14);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #feed .row:last-child { border-bottom: none; }
  #feed .t { color: #5f6c96; margin-right: 6px; }
  #hint { position: absolute; right: 16px; bottom: 14px; font-size: 10px; color: #4a567c; }
  #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #5f6c96; font-size: 12px; z-index: 5; }
</style>
<script type="importmap">{ "imports": { "three": "./lib/three.module.min.js" } }</script>
</head>
<body>
<canvas id="scene"></canvas>
<div id="loading">正在打开她的房间…</div>
<div id="top">
  <div class="title">🌅 上帝视角</div>
  <div class="meta" id="mood">…</div>
  <div class="spacer"></div>
  <div class="clock" id="clock">--:--</div>
</div>
<div id="statusbar"><b id="activity">…</b></div>
<div id="feed"></div>
<div id="hint">她的房间 · 实时</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './lib/GLTFLoader.js';

var canvas = document.getElementById('scene');
var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

var scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0e16);
scene.fog = new THREE.Fog(0x0b0e16, 20, 60);

var camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 200);

// 灯光
var hemi = new THREE.HemisphereLight(0x9fb8ff, 0x1a2238, 0.9);
scene.add(hemi);
var key = new THREE.DirectionalLight(0xffffff, 2.2);
key.position.set(4, 8, 6);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
scene.add(key);
var fill = new THREE.DirectionalLight(0x7f9fff, 1.0);
fill.position.set(-6, 4, -4);
scene.add(fill);
var warm = new THREE.PointLight(0xffb070, 1.4, 14, 2);
warm.position.set(0, 2.2, 0);
scene.add(warm);

// 她（Sprite 头像）
var herSprite = null;
function makeHer() {
  var tex = new THREE.TextureLoader().load('avatar.png');
  tex.colorSpace = THREE.SRGBColorSpace;
  var mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false });
  var s = new THREE.Sprite(mat);
  s.scale.set(0.9, 0.9, 1);
  scene.add(s);
  return s;
}

var room = null, roomBox = null, roomSize = null;

function startRoom() {
var loader = new GLTFLoader();
loader.load('room/room.gltf', function (gltf) {
  room = gltf.scene;
  roomBox = new THREE.Box3().setFromObject(room);
  roomSize = roomBox.getSize(new THREE.Vector3());
  var center = roomBox.getCenter(new THREE.Vector3());
  room.position.sub(center);
  scene.add(room);
  document.getElementById('loading').style.display = 'none';

  var maxDim = Math.max(roomSize.x, roomSize.y, roomSize.z);
  herSprite = makeHer();
  herSprite.scale.set(maxDim * 0.16, maxDim * 0.16, 1);
  herSprite.position.set(0, 0.6, 0);

  // 等距相机
  var dist = maxDim * 1.45;
  camera.position.set(dist * 0.75, dist * 0.85, dist * 0.75);
  camera.lookAt(0, 0, 0);
  updateHer('家');
}, undefined, function (err) {
  document.getElementById('loading').innerHTML =
    '房间素材未安装<br><span style="font-size:10px;color:#4a567c">把 room.gltf 放到 milky-way-3d/room/ 即可（见 docs/可选组件.md）</span>';
  console.error(err);
});
}

// 功能开关：房间展示可关闭
fetch('http://' + location.hostname + ':8900/api/features?token=anshiyu-app-2026', { cache: 'no-store' })
  .then(function (r) { return r.json(); })
  .then(function (f) {
    if (f && f.room === false) {
      document.getElementById('loading').innerHTML =
        '房间展示已关闭<br><span style="font-size:10px;color:#4a567c">在 App 设置 → 功能开关 里可以开启</span>';
      return;
    }
    startRoom();
  })
  .catch(function () { startRoom(); });

// 位置映射（房间内相对坐标，归一化 -0.5 ~ 0.5）
var ROOM_SPOTS = {
  '客厅': [0.0, 0.2],
  '厨房': [0.26, -0.08],
  '阳台': [-0.12, -0.28],
  '卧室': [-0.24, 0.22],
  '家': [0.0, 0.05],
};
function updateHer(loc) {
  if (!herSprite || !roomSize) return;
  var spot = ROOM_SPOTS['家'];
  for (var k in ROOM_SPOTS) {
    if (loc && loc.indexOf(k) >= 0 && k !== '家') { spot = ROOM_SPOTS[k]; break; }
  }
  herSprite.position.x = spot[0] * roomSize.x;
  herSprite.position.z = spot[1] * roomSize.z;
  herSprite.position.y = roomSize.y * 0.12;
}

function clock() {
  var d = new Date();
  document.getElementById('clock').textContent =
    String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
clock(); setInterval(clock, 10000);

var base = location.origin.replace(':8899', ':8900');
var token = 'anshiyu-app-2026';

function get(url) {
  return fetch(url, { cache: 'no-store' }).then(function (r) { return r.json(); }).catch(function () { return null; });
}

var targetPos = new THREE.Vector3(0, 0, 0);

function refresh() {
  get(base + '/api/status?token=' + token).then(function (d) {
    if (!d) return;
    var life = d.life || {};
    var mood = life.mood || '平静';
    var act = life.activity || '发呆';
    var loc = life.location || '家';
    document.getElementById('mood').textContent = mood + ' · ' + loc;
    document.getElementById('activity').textContent = '她正在 ' + act;
    updateHer(loc);
  });
  get(base + '/api/feed?token=' + token).then(function (d) {
    var feed = (d && d.items) || [];
    var html = '';
    for (var i = 0; i < Math.min(feed.length, 8); i++) {
      var it = feed[i];
      var ts = it.ts ? new Date(it.ts * 1000) : null;
      var t = ts ? String(ts.getHours()).padStart(2, '0') + ':' + String(ts.getMinutes()).padStart(2, '0') : '';
      var text = (it.text || '').replace(/</g, '&lt;').slice(0, 40);
      html += '<div class="row"><span class="t">' + t + '</span>' + text + '</div>';
    }
    document.getElementById('feed').innerHTML = html || '<div class="row">她还没做什么</div>';
  });
}
refresh(); setInterval(refresh, 5000);

// 缓慢环绕（可选，轻）
var t0 = performance.now();
function animate() {
  requestAnimationFrame(animate);
  var t = (performance.now() - t0) / 1000;
  if (camera && !camera.userData.fixed) {
    // 轻微呼吸感
    var basePos = camera.position.clone();
    camera.position.y = basePos.y + Math.sin(t * 0.3) * 0.02;
  }
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', function () {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
